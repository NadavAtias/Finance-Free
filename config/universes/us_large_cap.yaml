# US large caps for the System Conviction book: 100 of the largest and most
# liquid S&P 500 companies as of late 2026, chosen once and fixed.
#
# Survivorship warning: this is TODAY's list. Backtests over earlier years only
# include companies that went on to become large, which flatters them. Signal
# scores are measured against this universe's own average to net out most of
# that drift, but treat backtest numbers as optimistic. Paper results from the
# start date on are free of this bias.
